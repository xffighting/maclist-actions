name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions:
    name: Cling actions · no-UI regression
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run non-UI customization tests
        env:
          MACLIST_TEST_NO_UI: "1"
        run: ./test.sh

  standalone:
    name: Standalone core · unit and smoke tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Record Swift toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Run Swift package tests
        run: swift test --package-path standalone

      - name: Compile and exercise the standalone CLI
        run: ./standalone/smoke-test.sh

  native-app:
    name: Native app · automatic dialog flow
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run native core unit tests
        run: swift test --package-path app

      - name: Run framework-free smoke tests
        run: ./app/Scripts/all-smoke-tests.sh

      - name: Build and verify one private app artifact without launching UI
        shell: zsh {0}
        env:
          MACLIST_SKIP_XCTEST: "1"
        run: |
          set -euo pipefail
          zsh -n app/Scripts/verify.sh
          external_output="$RUNNER_TEMP/verify-must-not-use-this-output"
          [[ ! -e "$external_output" ]]
          APP_OUTPUT_DIR="$external_output" ./app/Scripts/verify.sh
          [[ ! -e "$external_output" ]]

      - name: Exercise installer success and complete rollback without launching
        shell: zsh {0}
        run: |
          set -euo pipefail
          zsh -n app/Scripts/install-local.sh
          zsh -n app/Scripts/install-local-smoke.sh
          /bin/zsh app/Scripts/install-local.sh --help | grep -Fq 'not launched unless --launch is supplied'
          ./app/Scripts/install-local-smoke.sh
          ! pgrep -x MacList

      - name: Enforce the no-switching primary flow
        shell: zsh {0}
        run: |
          set -euo pipefail
          forbidden='NSApp\.(activate|deactivate)|NSWorkspace\.shared\.open|activateFileViewerSelecting|NSPasteboard|NSAppleScript|RegisterEventHotKey|addGlobalMonitorForEvents'
          for source in app/Sources/MacList/*.swift; do
            [[ "${source:t}" == "LocalIndexCoordinator.swift" ]] && continue
            if /usr/bin/grep -nE "$forbidden" "$source"; then
              print -u2 'FAIL native primary flow contains app switching or clipboard behavior'
              exit 1
            fi
          done
          /usr/bin/grep -Fq 'let panel = NSOpenPanel()' app/Sources/MacList/LocalIndexCoordinator.swift
          /usr/bin/grep -Fq 'NSApp.activate' app/Sources/MacList/LocalIndexCoordinator.swift
          print 'PASS primary flow has no app switching; activation is limited to user-requested folder setup'

  media:
    name: Release media · dimensions and privacy
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify social-preview requirements
        shell: zsh {0}
        run: |
          set -euo pipefail
          preview="docs/assets/social-preview.png"
          [[ -f "$preview" ]]
          [[ "$(stat -f '%z' "$preview")" -lt 1048576 ]]
          [[ "$(sips -g pixelWidth "$preview" | awk '/pixelWidth/ {print $2}')" == "1280" ]]
          [[ "$(sips -g pixelHeight "$preview" | awk '/pixelHeight/ {print $2}')" == "640" ]]

      - name: Compile Vision media auditor
        run: xcrun swiftc tools/audit_media.swift -o "$RUNNER_TEMP/maclist-media-audit"

      - name: Audit every release image and GIF frame
        run: |
          "$RUNNER_TEMP/maclist-media-audit" \
            docs/assets/social-preview.png \
            docs/assets/demo-poster.png \
            docs/assets/maclist-demo.gif

  repository:
    name: Repository · metadata, links, and sensitive data
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Parse repository YAML
        shell: ruby {0}
        run: |
          require "yaml"

          files = Dir.glob("{.github,docs}/**/*.{yml,yaml}")
          abort "No YAML files found" if files.empty?
          files.each do |path|
            YAML.safe_load(File.read(path), aliases: true, filename: path)
          end
          puts "PASS parsed #{files.length} YAML file(s)"

      - name: Verify relative Markdown links
        run: python3 tools/verify_markdown_links.py

      - name: Reject local paths and credential-shaped strings
        shell: zsh {0}
        run: |
          set -euo pipefail

          if git grep -nI -E '/Users/[[:alnum:]_.-]+' -- . ':(exclude)tools/audit_media.swift'; then
            print -u2 'FAIL tracked text contains an absolute macOS user path'
            exit 1
          fi

          if git grep -nI -E -- \
            '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' \
            -- .; then
            print -u2 'FAIL tracked text contains a private key or credential-shaped string'
            exit 1
          fi

          print 'PASS no absolute macOS user paths or credential-shaped strings found'

      - name: Verify native preview metadata
        shell: zsh {0}
        run: |
          set -euo pipefail
          [[ "$(tr -d '[:space:]' < VERSION)" == "0.3.0" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Resources/Info.plist)" == "0.3.0" ]]
          grep -Fq '## Unreleased' CHANGELOG.md
          grep -Fq 'swift-tools-version: 6.0' standalone/Package.swift
          print 'PASS v0.3.0 native preview metadata is internally consistent'
